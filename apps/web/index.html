<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#E9EBEF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nokker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Titre réel posé par App.tsx depuis packages/brand (source unique de la marque). -->
    <title>Nokker</title>
    <meta name="description" content="Nokker — le chat de Nina, ses sessions et ses bulles vivantes" />
    <!-- Kit de marque : packages/brand/assets, servi sous /brand/ (vite.config.ts). -->
    <link rel="icon" href="/brand/icon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/icon/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/brand/icon/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Polices du kit de marque servies par le paquet (packages/brand/assets/fonts, OFL) : rien de Google. -->
    <link rel="preload" href="/brand/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/brand/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
