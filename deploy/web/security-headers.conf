# En-têtes de sécurité du web Nokker, inclus dans CHAQUE location de nginx.conf (un add_header dans une location remplace
# ceux du niveau server). Même fichier relu par `vite preview` (apps/web/vite.config.ts), pour que les e2e tournent sous
# la politique servie en prod. Une ligne par en-tête, valeur entre guillemets doubles.
#
# CSP BLOQUANTE (p2/web-csp), après une mesure en Report-Only sur toutes les recettes e2e (une seule violation : l'aperçu
# cast en srcdoc, remplacé par le cadre signé du noyau, qui porte sa propre CSP). Les e2e relèvent toute violation.
# - frame-src 'self' : cadre de l'aperçu cast (/v1/cast/{id}/frame) et pages signées locales ; https://*.nokker.app :
#   pages d'une machine liée relayées par la passerelle (<nom>--pages.nokker.app, docs/BUBBLES.md §10.3).
# - script-src https://apis.google.com, frame-src https://docs.google.com : sélecteur Google (Drive, CONNECTORS-OAUTH §0.2).
# - style-src / font-src Google Fonts : la police de la coque (index.html).
# - img-src data: blob: : codes QR, aperçus d'images choisies ; media-src blob: : lecture à voix haute.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src 'self' https://docs.google.com https://*.nokker.app; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Micro : détection des coups (knock) et voix ; tout le reste coupé.
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), display-capture=(), interest-cohort=()" always;
# Le tunnel Cloudflare ne pose pas de HSTS (curl -D https://app.nokker.ai/, 05.11.2026).
add_header Strict-Transport-Security "max-age=31536000" always;
