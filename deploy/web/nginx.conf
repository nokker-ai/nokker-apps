# Serveur statique du web Nokker. Le routage /v1/ vers le noyau (même origine, sans CORS) se fait à l'ingress, pas ici.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Jamais en cache navigateur : une mise à jour du service worker ou du manifest doit être vue au prochain contrôle.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Apps natives (Capacitor) : /.well-known/apple-app-site-association et /.well-known/assetlinks.json, à déposer dans
    # apps/web/public/.well-known/. AASA n'a pas d'extension : Apple exige du JSON, sans redirection.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /.well-known/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
